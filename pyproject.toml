[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "fttxplan"
version = "0.1.0"
description = "Open-source FTTx / GPON network planning: route fibre along real roads, place splitters, size cables, check the optical budget and get a bill of materials."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gul Nawaz", email = "gulnawaz001@outlook.com" }]
requires-python = ">=3.10"
keywords = ["fttx", "ftth", "gpon", "fiber", "fibre", "network planning", "gis", "telecom", "openstreetmap", "geopandas"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "geopandas>=0.14",
  "shapely>=2.0",
  "networkx>=3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pyproj>=3.5",
  "matplotlib>=3.7",
  "folium>=0.15",
  "simplekml>=1.3",
]

[project.optional-dependencies]
osm = ["osmnx>=2.0"]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.4", "nbconvert", "ipykernel"]

[project.scripts]
fttxplan = "fttxplan.cli:main"

[project.urls]
Homepage = "https://github.com/Gull01/fttxplan"
Issues = "https://github.com/Gull01/fttxplan/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fttxplan"]

[tool.hatch.build.targets.sdist]
include = ["src/fttxplan", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/fttxplan"]
addopts = "--doctest-modules --import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 150
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "B905", "SIM108"]
